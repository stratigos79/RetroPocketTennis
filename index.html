<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snoopy Tennis SP-30</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;touch-action:none}
.unit{width:min(1100px,100vw);height:min(610px,100vh);background:#f0e5b8;border:7px solid #8b5c91;border-radius:12px;box-shadow:0 10px 35px #777;display:grid;grid-template-columns:145px 1fr 145px;gap:8px;padding:12px}
.side{display:flex;flex-direction:column;align-items:center}.left{justify-content:space-between;padding:15px 0 25px}.right{justify-content:flex-start;padding-top:15px}
.logo{font-weight:900;font-size:22px;line-height:.85;text-align:center;border:2px solid #222;padding:8px 6px}.logo small{font-size:12px}
.snoopy{font-size:44px;filter:grayscale(1);margin-top:12px}
.red{width:68px;height:68px;border-radius:50%;background:#c63f38;border:4px solid #333;box-shadow:inset 0 -6px #8c2927}
.hitlabel{font-weight:900;margin-top:-8px}.center{display:flex;flex-direction:column;min-width:0}
.heading{font-family:Georgia,serif;text-align:center;font-weight:900;font-size:22px;letter-spacing:1px;margin:2px 0 7px}
.frame{flex:1;background:#c9c8a9;border:5px solid #fff;box-shadow:0 0 0 3px #81568a,0 0 0 6px #222;border-radius:4px;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.wide{text-align:center;font-family:Georgia,serif;font-weight:900;font-size:16px;margin-top:7px}
.right .caps{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cap{height:34px;border-radius:9px;border:2px solid #4b3b4b;background:#bda9c0;font-size:11px;font-weight:900}.cap.active{background:#79567e;color:#fff}
.time{font-size:11px;font-weight:900;margin-top:8px}
.round{width:54px;height:54px;border-radius:50%;border:4px solid #333;background:#c63f38;box-shadow:inset 0 -5px #8c2927;margin-top:13px}
.updown{font-size:10px;font-weight:900}
@media(max-width:700px){
.unit{width:100vw;height:100vh;border-width:4px;border-radius:0;grid-template-columns:62px 1fr 62px;gap:4px;padding:7px}
.left{padding:8px 0 16px}.right{padding-top:8px}.logo{font-size:10px;border-width:1px;padding:4px 2px}.logo small{font-size:6px}.snoopy{font-size:20px}.red{width:40px;height:40px;border-width:3px}.hitlabel{font-size:8px}.heading{font-size:11px;margin:0 0 4px}.wide{font-size:8px;margin-top:5px}.right .caps{gap:3px}.cap{height:24px;font-size:6px;border-width:1px}.round{width:38px;height:38px;border-width:3px;margin-top:7px}.updown{font-size:6px}.time{font-size:6px}
}
</style>
</head>
<body>
<div class="unit">
<aside class="side left">
  <div><div class="logo">GAME<br>&amp; WATCH<br><small>Nintendo</small></div><div class="snoopy">SNOOPY</div></div>
  <div><button class="red" id="hit"></button><div class="hitlabel">HIT</div></div>
</aside>
<main class="center">
  <div class="heading">SNOOPY TENNIS</div>
  <div class="frame"><canvas id="lcd" width="1581" height="900"></canvas></div>
  <div class="wide">WIDE SCREEN</div>
</main>
<aside class="side right">
 <div class="caps"><button class="cap active" id="gameA">GAME A</button><button class="cap">ALARM</button><button class="cap" id="gameB">GAME B</button><button class="cap">ACL</button></div>
 <div class="time">TIME</div>
 <button class="round" id="up"></button><div class="updown">UP</div>
 <button class="round" id="down"></button><div class="updown">DOWN</div>
</aside>
</div>
<script>
const c=document.getElementById('lcd'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const bg='#c8c9a9',ink='#3f453b',green='#4e8c4d',brown='#92503c',red='#9f3f34';
let running=false,mode='A',lane=1,score=0,miss=0,ball=null,spawn=.7,last=0,paused=false;
const Y=[315,500,685];

function r(x,y,w,h,col=ink){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function p(x,y,s,grid,col=ink){for(let yy=0;yy<grid.length;yy++)for(let xx=0;xx<grid[yy].length;xx++)if(grid[yy][xx]==='1')r(x+xx*s,y+yy*s,s,s,col)}
function t(v,x,y,size,align='left'){g.fillStyle=ink;g.font=`bold ${size}px monospace`;g.textAlign=align;g.fillText(v,x,y)}

const snoopy=[
"0000011111000","0001111111110","0011111111111","0111111111111","1111110011111",
"1111100001111","1111111111111","0111111111110","0011111111100","0001111111000",
"0000111110000","0000111110000","0001111111000","0011000110000","0110000011000"];
const charlie=[
"0000011111000","0001111111110","0011111111111","0111111111111","0111111111111",
"1111100011111","1111111111111","0111111111110","0011111111100","0001111111000",
"0000111110000","0000111110000","0001111111000","0011000110000","0110000011000"];
const lucy=[
"0000111111100","0011111111110","0111111111111","1111111111111","1111000011111",
"1111111111111","0111111111110","0011111111100","0011111111100","0111111111110",
"1110000001110","1100000000110","1100000000110"];

function tree(){
 r(1370,115,34,690,brown);r(1330,270,30,350,brown);r(1410,205,25,420,brown);
 for(const q of [[1375,120],[1315,255],[1420,205],[1300,380],[1430,420],[1315,560],[1440,625],[1350,720]]){
  r(q[0],q[1],24,18,green);r(q[0]-14,q[1]+8,52,12,green)
 }
 // three red platforms
 for(const y of Y){r(1320,y+46,185,15,red);r(1360,y+61,105,9,brown)}
 // dog house
 r(1395,730,105,100,red);r(1378,705,140,35,brown);r(1430,765,35,65,bg)
}
function grass(){for(let x=20;x<1320;x+=34){r(x,842,7,5,green);r(x+6,837,7,5,green);r(x+12,842,7,5,green)}}
function scene(){
 g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);
 // LCD texture
 for(let y=0;y<900;y+=7)r(0,y,1581,2,'#c1c2a2');
 t('AM',35,65,28);t('12:01',105,65,42);t(String(score).padStart(3,'0'),310,65,42);
 t('MISS',530,65,27);for(let i=0;i<3;i++)r(650+i*25,43,16,22,i<miss?ink:bg);
 tree();grass();
 // left red net/roof
 r(25,585,150,16,red);r(45,601,18,95,brown);
 p(70,590,5,charlie); 
 // snoopy
 p(1235,Y[lane]-75,5,snoopy);
 // racket near snoopy
 r(1300,Y[lane]-5,8,80,brown);
 if(ball){r(ball.x-7,ball.y-7,14,14,ink);r(ball.x-3,ball.y-11,6,5,ink)}
 if(!running){r(560,355,460,130,bg);t('START',790,420,38,'center');t(mode==='A'?'GAME A':'GAME B',790,465,25,'center')}
 if(paused){r(560,355,460,130,bg);t('PAUSE',790,430,38,'center')}
}
function start(){score=0;miss=0;lane=1;ball=null;spawn=.7;running=true;paused=false;last=performance.now();requestAnimationFrame(loop)}
function newBall(){let k=Math.floor(Math.random()*3);ball={x:180,y:Y[k],target:k,vx:mode==='B'?480:390};spawn=mode==='B'?.55:.82}
function update(dt){
 if(!ball){spawn-=dt;if(spawn<=0)newBall();return}
 ball.x+=ball.vx*dt;
 if(ball.x>1520){miss++;ball=null;if(miss>=3)running=false;else spawn=.35}
}
function loop(now){if(!running){scene();return}if(!paused){update(Math.min(.035,(now-last)/1000));last=now}scene();requestAnimationFrame(loop)}
document.getElementById('hit').onclick=()=>{if(!running||paused||!ball)return;if(ball.x>1090&&Math.abs(ball.y-Y[lane])<65){score+=3;ball=null;spawn=.25}}
document.getElementById('up').onclick=()=>{if(running&&!paused)lane=Math.max(0,lane-1)}
document.getElementById('down').onclick=()=>{if(running&&!paused)lane=Math.min(2,lane+1)}
document.getElementById('gameA').onclick=()=>mode='A'
document.getElementById('gameB').onclick=()=>mode='B'
document.body.addEventListener('dblclick',start);
document.getElementById('hit').addEventListener('contextmenu',e=>e.preventDefault());
scene();
</script>
</body>
</html>
