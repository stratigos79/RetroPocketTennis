<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snoopy Tennis SP-30</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="device">
<header class="brand"><div>N I N T E N D O</div><small>G A M E  &amp;  W A T C H</small><h1>SNOOPY TENNIS</h1></header>
<section class="screen-shell"><div class="bezel"><canvas id="lcd" width="480" height="300"></canvas></div></section>
<section class="controls">
<button id="gameA" class="purple">GAME A</button><button id="gameB" class="purple">GAME B</button>
<button id="hit" class="hit">HIT</button><button id="pause" class="cream">Ⅱ</button>
<button id="up" class="cream arrow">▲<span>UP</span></button><button id="down" class="cream arrow">▼<span>DOWN</span></button>
<button id="start" class="start cream">START</button>
<button id="alarm" class="purple wide">ALARM</button><button id="acl" class="purple wide">ACL</button>
</section></main>
<script src="game.js"></script>
</body></html>
