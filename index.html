<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Snoopy Tennis SP-30</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#ddd;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;touch-action:none}.device{width:min(1120px,96vw);height:min(92vh,660px);background:#eee2ad;border:7px solid #7e4f83;border-radius:12px;box-shadow:0 10px 30px #777;display:grid;grid-template-columns:15% 70% 15%;padding:10px}.left,.right{display:flex;flex-direction:column;align-items:center}.left{justify-content:space-between;padding:3% 0 7%}.right{padding-top:3%}.nin{font-weight:900;font-size:clamp(9px,1.4vw,16px);letter-spacing:1px}.gw{font-weight:900;text-align:center;font-size:clamp(13px,2vw,24px);line-height:.9;margin-top:3px}.peanuts{font-family:Georgia,serif;font-weight:900;font-size:clamp(13px,1.8vw,22px);line-height:1.1;text-align:center;transform:rotate(-3deg)}.hit,.round{border-radius:50%;border:4px solid #392f30;background:#c7443d;box-shadow:inset 0 -7px #8c2c2a}.hit{width:clamp(52px,6.5vw,78px);height:clamp(52px,6.5vw,78px)}.round{width:clamp(43px,5.3vw,64px);height:clamp(43px,5.3vw,64px);margin-top:8px}.lab{font-weight:900;font-size:clamp(8px,1vw,12px);margin-top:-2px}.title{font-family:Georgia,serif;font-weight:900;font-size:clamp(15px,2.2vw,27px);text-align:center;margin:0 0 5px}.screen{width:100%;height:auto;aspect-ratio:1581/1080;border:6px solid #fff;border-radius:5px;box-shadow:0 0 0 4px #7d4d83,0 0 0 8px #222;overflow:hidden;background:#c9caa9}.screen canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.wide{text-align:center;font-family:Georgia,serif;font-weight:900;font-size:clamp(9px,1.2vw,14px);margin-top:5px}.buttons{width:94%;display:grid;grid-template-columns:1fr 1fr;gap:5px}.btn{height:clamp(27px,3.6vw,40px);border:2px solid #5c455e;border-radius:8px;background:#bda9c0;font-weight:900;font-size:clamp(7px,1vw,12px)}.btn.active{background:#76517b;color:#fff}.time{font-weight:900;font-size:clamp(8px,1vw,12px);margin:6px}@media(max-width:700px){.device{width:98vw;height:94vh;border-width:4px;padding:5px}.screen{border-width:4px}.title{margin-bottom:3px}}</style></head><body><div class="device"><aside class="left"><div><div class="nin">NINTENDO</div><div class="gw">GAME<br>&amp; WATCH</div></div><div class="peanuts">SNOOPY<br><small>TENNIS</small></div><div><button class="hit" id="hit"></button><div class="lab">HIT</div></div></aside><main><h1 class="title">SNOOPY TENNIS</h1><div class="screen"><canvas id="lcd" width="1581" height="1080"></canvas></div><div class="wide">WIDE SCREEN</div></main><aside class="right"><div class="buttons"><button id="a" class="btn active">GAME A</button><button class="btn">ALARM</button><button id="b" class="btn">GAME B</button><button class="btn">ACL</button></div><div class="time">TIME</div><button id="up" class="round"></button><div class="lab">UP</div><button id="down" class="round"></button><div class="lab">DOWN</div></aside></div><script>const c=document.getElementById('lcd'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const W=1581,H=1080,BG='#c9caa9',S='#45493f',G='#4c8b4c',B='#92503b',R='#9d4035';let mode='A',run=false,lane=1,score=0,miss=0,ball=null,timer=.8,last=0;const Y=[470,620,770];function q(x,y,w,h,c=S){g.fillStyle=c;g.fillRect(x,y,w,h)}function txt(s,x,y,z,a='left'){g.fillStyle=S;g.font=`bold ${z}px monospace`;g.textAlign=a;g.fillText(s,x,y)}function person(x,y,type){g.fillStyle=S;g.beginPath();if(type===0){g.arc(x+24,y+20,16,0,7);q(x+4,y+32,42,22);q(x+12,y+54,9,32);q(x+31,y+54,9,32);q(x-2,y+34,12,8)}else{q(x+7,y,30,10);q(x,y+8,45,25);q(x+8,y+32,30,14);q(x+11,y+46,8,31);q(x+29,y+46,8,31)}g.fill()}function snoopy(x,y){q(x+18,y,28,8);q(x+8,y+7,48,13);q(x,y+17,62,17);q(x+8,y+34,43,14);q(x+16,y+48,9,27);q(x+39,y+48,9,27);q(x-6,y+20,12,8);q(x+51,y+10,14,9);q(x+58,y+40,5,50,B);q(x+63,y+32,28,5,B)}function tree(){q(1375,90,35,790,B);q(1325,260,30,390,B);q(1425,205,25,470,B);[[1340,110],[1290,270],[1430,210],[1275,400],[1440,520],[1290,650],[1445,735],[1330,830]].forEach(a=>{q(a[0],a[1],45,14,G);q(a[0]+10,a[1]-8,22,27,G)});Y.forEach(y=>{q(1280,y+35,190,15,R);q(1320,y+50,100,10,B)});q(1390,900,105,95,R);q(1370,878,145,28,B);q(1425,925,34,70,BG)}function draw(){g.fillStyle=BG;g.fillRect(0,0,W,H);for(let y=0;y<H;y+=9)q(0,y,W,2,'#c0c2a2');txt('AM',35,58,25);txt('12:00',96,58,42);txt(String(score).padStart(3,'0'),305,58,42);txt('MISS',520,58,25);for(let i=0;i<3;i++)q(610+i*26,38,16,22,i<miss?S:BG);tree();q(55,780,180,14,R);q(72,794,10,105,B);person(105,725,1);snoopy(1195,Y[lane]-45);if(ball)q(ball.x,ball.y,14,14,S);if(!run){q(540,420,500,150,BG);txt('START',790,480,44,'center');txt(mode==='A'?'GAME A':'GAME B',790,525,25,'center')}}function start(){run=true;score=0;miss=0;lane=1;ball=null;timer=.8;last=performance.now();requestAnimationFrame(loop)}function spawn(){let k=Math.floor(Math.random()*3);ball={x:230,y:Y[k],v:mode==='B'?500:410};timer=mode==='B'?.5:.8}function update(dt){if(!ball){timer-=dt;if(timer<=0)spawn();return}ball.x+=ball.v*dt;if(ball.x>1510){miss++;ball=null;if(miss>=3)run=false;else timer=.35}}function loop(n){if(!run){draw();return}update(Math.min(.035,(n-last)/1000));last=n;draw();requestAnimationFrame(loop)}hit.onclick=()=>{if(run&&ball&&ball.x>1050&&Math.abs(ball.y-Y[lane])<65){score+=3;ball=null;timer=.2}};up.onclick=()=>{if(run)lane=Math.max(0,lane-1)};down.onclick=()=>{if(run)lane=Math.min(2,lane+1)};a.onclick=()=>{mode='A';a.classList.add('active');b.classList.remove('active')};b.onclick=()=>{mode='B';b.classList.add('active');a.classList.remove('active')};document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!run)start();if(e.key==='ArrowUp')up.click();if(e.key==='ArrowDown')down.click();if(e.code==='Space')hit.click()});document.querySelector('.screen').onclick=()=>{if(!run)start()};draw();</script></body></html>
