<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snoopy Tennis SP-30</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}body{background:#ddd;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;touch-action:none}
.device{width:min(1120px,100vw);aspect-ratio:1.72;background:#eee1aa;border:7px solid #815086;border-radius:12px;box-shadow:0 12px 35px #666;display:grid;grid-template-columns:15% 70% 15%;padding:12px}
.left,.right{display:flex;flex-direction:column;align-items:center}.left{justify-content:space-between;padding:3% 0 8%}.right{padding-top:3%}
.nin{font-weight:900;font-size:clamp(10px,1.5vw,17px);letter-spacing:1px}.gw{font-weight:900;text-align:center;font-size:clamp(14px,2vw,25px);line-height:.9;margin-top:3px}
.title{font-family:Georgia,serif;font-weight:900;font-size:clamp(17px,2.6vw,31px);text-align:center;margin:0 0 8px}.screen{width:100%;aspect-ratio:1.68;border:6px solid #fff;box-shadow:0 0 0 4px #7d4d83,0 0 0 8px #222;border-radius:5px;overflow:hidden;background:#c9caa9}.screen canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.wide{text-align:center;font-family:Georgia,serif;font-weight:900;margin-top:7px;font-size:clamp(10px,1.4vw,16px)}
.hit,.round{border-radius:50%;border:4px solid #3a3030;background:#c8443d;box-shadow:inset 0 -7px #8b2b29}.hit{width:clamp(55px,7vw,84px);height:clamp(55px,7vw,84px)}.round{width:clamp(45px,5.8vw,68px);height:clamp(45px,5.8vw,68px);margin-top:10px}.lab{font-weight:900;font-size:clamp(8px,1.1vw,13px);margin-top:-3px}
.buttons{width:92%;display:grid;grid-template-columns:1fr 1fr;gap:6px}.btn{height:clamp(29px,4vw,43px);border:2px solid #5c455e;border-radius:8px;background:#bda9c0;font-weight:900;font-size:clamp(7px,1vw,12px)}.btn.active{background:#76517b;color:#fff}.time{font-weight:900;font-size:clamp(8px,1vw,12px);margin:7px}
@media(max-width:700px){.device{border-width:4px;padding:6px}.screen{border-width:4px}.title{margin-bottom:5px}.left{padding-bottom:6%}.right{padding-top:2%}}
</style>
</head>
<body>
<div class="device">
<aside class="left">
<div><div class="nin">NINTENDO</div><div class="gw">GAME<br>&amp; WATCH</div></div>
<div style="font-family:Georgia,serif;font-weight:900;font-size:clamp(14px,2.2vw,28px);transform:rotate(-5deg)">SNOOPY<br><small>TENNIS</small></div>
<div><button class="hit" id="hit"></button><div class="lab">HIT</div></div>
</aside>
<main>
<h1 class="title">SNOOPY TENNIS</h1>
<div class="screen"><canvas id="lcd" width="1581" height="940"></canvas></div>
<div class="wide">WIDE SCREEN</div>
</main>
<aside class="right">
<div class="buttons"><button id="a" class="btn active">GAME A</button><button class="btn">ALARM</button><button id="b" class="btn">GAME B</button><button class="btn">ACL</button></div>
<div class="time">TIME</div>
<button id="up" class="round"></button><div class="lab">UP</div>
<button id="down" class="round"></button><div class="lab">DOWN</div>
</aside>
</div>
<script>
const c=document.getElementById('lcd'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const BG='#c8c9a9',SEG='#41463c',GREEN='#4c8b4c',BROWN='#914e3a',RED='#9e4035';
let mode='A',running=false,lane=1,score=0,miss=0,ball=null,delay=.8,last=0;
const Y=[300,485,670];
function R(x,y,w,h,col=SEG){g.fillStyle=col;g.fillRect(x,y,w,h)}
function T(s,x,y,z,a='left'){g.fillStyle=SEG;g.font=`bold ${z}px monospace`;g.textAlign=a;g.fillText(s,x,y)}
function snoopy(x,y){
 // segmented side-profile silhouette
 R(x+17,y,27,6);R(x+8,y+6,44,8);R(x,y+13,58,12);R(x+8,y+25,42,11);
 R(x+15,y+35,9,24);R(x+38,y+35,9,24);R(x+1,y+16,10,7);R(x+48,y+9,12,8);
 // racket
 R(x+53,y+25,5,52,BROWN);R(x+57,y+18,25,5,BROWN);R(x+78,y+14,5,20,BROWN);R(x+58,y+9,25,5,BROWN);
}
function cb(x,y){
 R(x+10,y,26,6);R(x+3,y+6,40,9);R(x,y+15,47,12);R(x+8,y+27,32,10);
 R(x+12,y+37,8,25);R(x+31,y+37,8,25);R(x+5,y+62,15,6);R(x+29,y+62,15,6);
}
function lucy(x,y){
 R(x+7,y,30,7);R(x,y+7,44,11);R(x-4,y+16,51,12);R(x+4,y+28,40,9);
 R(x+9,y+37,8,27);R(x+30,y+37,8,27);R(x+2,y+64,17,6);R(x+28,y+64,17,6);
}
function woodstock(x,y){R(x,y,18,7);R(x+4,y-6,7,7,GREEN);R(x+15,y-3,8,7,GREEN)}
function tree(){
 R(1370,95,34,690,BROWN);R(1320,245,28,360,BROWN);R(1420,190,24,420,BROWN);
 [[1340,105],[1285,250],[1425,195],[1270,360],[1440,420],[1285,545],[1440,620],[1330,700]].forEach(q=>{R(q[0],q[1],42,12,GREEN);R(q[0]+10,q[1]-8,20,27,GREEN)});
 Y.forEach(v=>{R(1290,v+43,180,14,RED);R(1330,v+57,95,9,BROWN)});
 // dog house
 R(1380,775,105,80,RED);R(1360,753,145,29,BROWN);R(1418,810,30,45,BG);
}
function draw(){
g.fillStyle=BG;g.fillRect(0,0,1581,940);
for(let y=0;y<940;y+=8)R(0,y,1581,2,'#c0c2a1');
T('AM',35,54,25);T('12:00',96,54,40);T(String(score).padStart(3,'0'),295,54,40);T('MISS',515,54,24);
for(let i=0;i<3;i++)R(610+i*25,34,15,20,i<miss?SEG:BG);
tree();R(60,615,175,13,RED);R(76,628,9,100,BROWN);cb(105,575);
snoopy(1200,Y[lane]-48);
if(ball){R(ball.x,ball.y,13,13,SEG)}
if(!running){R(535,345,510,145,BG);T('START',790,405,42,'center');T(mode==='A'?'GAME A':'GAME B',790,452,24,'center')}
}
function start(){running=true;score=0;miss=0;lane=1;ball=null;delay=.8;last=performance.now();requestAnimationFrame(loop)}
function spawn(){let k=Math.floor(Math.random()*3);ball={x:220,y:Y[k],v:mode==='B'?510:415,target:k};delay=mode==='B'?.5:.8}
function update(dt){if(!ball){delay-=dt;if(delay<=0)spawn();return}ball.x+=ball.v*dt;if(ball.x>1515){miss++;ball=null;if(miss>=3)running=false;else delay=.35}}
function loop(now){if(!running){draw();return}update(Math.min(.035,(now-last)/1000));last=now;draw();requestAnimationFrame(loop)}
document.getElementById('hit').onclick=()=>{if(running&&ball&&ball.x>1060&&Math.abs(ball.y-Y[lane])<62){score+=3;ball=null;delay=.2}}
document.getElementById('up').onclick=()=>{if(running)lane=Math.max(0,lane-1)}
document.getElementById('down').onclick=()=>{if(running)lane=Math.min(2,lane+1)}
document.getElementById('a').onclick=()=>{mode='A';a.classList.add('active');b.classList.remove('active')}
document.getElementById('b').onclick=()=>{mode='B';b.classList.add('active');a.classList.remove('active')}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!running)start();if(e.key==='ArrowUp')up.click();if(e.key==='ArrowDown')down.click();if(e.code==='Space')hit.click()});
document.querySelector('.screen').onclick=()=>{if(!running)start()};draw();
</script>
</body></html>
