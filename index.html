<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eadfa8"><title>Snoopy Tennis SP-30</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="unit">
<header class="brand"><div class="nintendo">NINTENDO</div><div class="gw">GAME &amp; WATCH</div><div class="title">SNOOPY TENNIS</div></header>
<section class="display-frame"><canvas id="game" width="1581" height="1080" aria-label="Snoopy Tennis game screen"></canvas></section>
<section class="controls">
 <div class="left"><button id="hit" class="hit">HIT</button></div>
 <div class="center"><div class="top"><button id="gameA" class="small active">GAME A</button><button id="gameB" class="small">GAME B</button></div><button id="pause" class="pause">Ⅱ</button><button id="start" class="start">START</button></div>
 <div class="right"><button id="up" class="round">▲<span>UP</span></button><button id="down" class="round">▼<span>DOWN</span></button></div>
 <div class="utility"><button id="alarm" class="small">TIME</button><button id="acl" class="small">ACL</button></div>
</section>
</main>
<script src="game.js"></script>
</body></html>
