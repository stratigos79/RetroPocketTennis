<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snoopy Tennis SP-30</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="device">
<header><b>N I N T E N D O</b><small>GAME &amp; WATCH</small><h1>SNOOPY TENNIS</h1></header>

<section class="screen"><canvas id="lcd" width="1580" height="1080"></canvas></section>

<!-- The real SP-30 uses three controls: HIT on the left, UP/DOWN on the right. -->
<section class="hardware-controls" aria-label="SP-30 controls">
  <button id="hit" class="hit">HIT</button>
  <div class="movement">
    <button id="up">▲<small>UP</small></button>
    <button id="down">▼<small>DOWN</small></button>
  </div>
</section>

<!-- These are web-game convenience controls, not part of the original hardware layout. -->
<section class="game-controls">
  <button id="gameA">GAME A</button>
  <button id="gameB">GAME B</button>
  <button id="start">START</button>
  <button id="pause">Ⅱ</button>
  <button id="reset">ACL</button>
</section>

<section class="lab">
<h2>SP-30 CHARACTER LAB — STAGE 4</h2>
<p>HIT αριστερά και UP/DOWN δεξιά, όπως στο πραγματικό SP-30. Τα υπόλοιπα είναι βοηθητικά web controls.</p>
<canvas id="editor" width="640" height="520"></canvas>
<div id="choices"></div>
</section>

<script src="game.js"></script>
<script src="controls-fix.js"></script>
</main>
</body>
</html>
