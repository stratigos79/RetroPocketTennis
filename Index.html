<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover"
  >

  <meta name="theme-color" content="#111111">

  <title>Snoopy Tennis SP-30</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="gameWrap">

    <!-- GAME SCREEN -->
    <canvas
      id="game"
      width="720"
      height="1100"
    >
      Snoopy Tennis SP-30
    </canvas>


    <!-- TOP INFORMATION -->

    <div id="hud">

      <div>
        <span id="mode">GAME A</span>
      </div>

      <div>
        SCORE
        <b id="score">0</b>
      </div>

      <div>
        BEST
        <b id="best">0</b>
      </div>

    </div>


    <!-- PAUSE -->

    <button
      id="pause"
      type="button"
      aria-label="Pause"
    >
      Ⅱ
    </button>


    <!-- GAME A / GAME B -->

    <div id="modes">

      <button
        id="gameA"
        type="button"
        class="active"
      >
        GAME A
      </button>

      <button
        id="gameB"
        type="button"
      >
        GAME B
      </button>

    </div>


    <!-- CONTROLS -->

    <div id="controls">

      <div class="dir">

        <button
          id="up"
          type="button"
        >
          ▲
          <small>UP</small>
        </button>

        <button
          id="down"
          type="button"
        >
          ▼
          <small>DOWN</small>
        </button>

      </div>


      <button
        id="hit"
        type="button"
      >
        HIT
      </button>

    </div>


    <!-- START -->

    <button
      id="start"
      type="button"
    >
      START
    </button>


    <!-- HELP -->

    <div id="tip">
      UP / DOWN = MOVE
      &nbsp; • &nbsp;
      HIT = TENNIS
    </div>

  </main>


  <!-- GAME ENGINE -->

  <script src="game.js"></script>

</body>

</html>
